[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stampede"
version = "0.1.0"
description = "A simulated market of AI trading agents that one headline can crash, with an MCP arena any agent can join"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Arush Gumber" },
  { name = "Arnesh Batra" },
  { name = "Pranav Viksar Garg" },
  { name = "Sidhant Gumber" },
]
dependencies = ["numpy>=2.0", "mcp>=2.3,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2"]
lab = ["torch>=2.4", "transformers>=4.45", "accelerate>=1.0", "peft>=0.13", "scipy>=1.13", "pandas>=2.2"]

[project.scripts]
stampede-mcp = "stampede.mcp_server.cli:main"

[tool.setuptools.packages.find]
include = ["stampede*"]

# The arena reads the headline bank and the response tables; installed copies go under <prefix>/share/stampede.
[tool.setuptools.data-files]
"share/stampede/data" = ["data/headlines.json"]
"share/stampede/results/surrogates" = ["results/surrogates/*.json"]
